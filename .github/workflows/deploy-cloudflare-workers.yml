name: Deploy AIRI to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: airi-cloudflare-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node and pnpm
        uses: pnpm/setup@v2
        with:
          runtime: node@26.7.0
          cache: true
          install: false

      - name: Install Wrangler
        run: pnpm i -g wrangler@4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          NODE_OPTIONS: --max-old-space-size=6144

      - name: Build workspace packages
        run: pnpm run build:packages
        env:
          NODE_OPTIONS: --max-old-space-size=6144

      - name: Build AIRI web app
        run: pnpm -F @proj-airi/stage-web run build
        env:
          NODE_OPTIONS: --max-old-space-size=6144
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
          S3_REGION: ${{ secrets.S3_REGION }}
          WARP_DRIVE_PUBLIC_BASE: ${{ secrets.WARP_DRIVE_PUBLIC_BASE }}
          VITE_ENABLE_ANALYTICS: 'false'

      - name: Remove assets exceeding Cloudflare's per-file limit
        shell: bash
        run: |
          cd ./apps/stage-web/dist
          find . -type f -size +25M -print -delete
          echo "Remaining largest assets:"
          find . -type f -printf '%s %p\n' | sort -nr | sed -n '1,20p'

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy -c ./apps/stage-web/wrangler.toml
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
